lor:#bec9c3;font-size:11px}.section{max-width:1184px;margin:0 auto;padding:110px 28px}.section-heading{max-width:670px;margin-bottom:48px}.section-heading h2,.compare h2{font-size:clamp(40px,5vw,61px);line-height:1.05;margin:0 0 18px}.section-heading>p:not(.eyebrow),.compare>div>p:not(.eyebrow){color:var(--muted);font-size:16px;line-height:1.7}.three-up{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.three-up article{border-top:1px solid #aeb8b2;padding-top:22px}.three-up article>span{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.15em}.three-up h3{font-size:19px;margin:22px 0 9px}.three-up p{color:var(--muted);font-size:13px;line-height:1.7}.soft{max-width:none;background:var(--cream);padding-left:max(28px,calc((100vw - 1128px)/2));padding-right:max(28px,calc((100vw - 1128px)/2))}.condition-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.condition-cards a{min-height:190px;padding:25px;background:var(--paper);border:1px solid #e1e1d8;display:flex;flex-direction:column;justify-content:space-between;border-radius:4px 20px 4px 4px;transition:.2s}.condition-cards a:hover{transform:translateY(-4px);box-shadow:0 14px 40px #1f31291a}.condition-cards span{color:var(--green);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.13em}.condition-cards strong{font-family:"DM Serif Display",serif;font-size:25px;line-height:1.1;font-weight:400}.condition-cards em{font-style:normal;font-size:11px;font-weight:900}.compare{display:grid;grid-template-columns:1.1fr .9fr;gap:90px;align-items:center}.text-link{font-weight:900;color:var(--green);display:inline-block;margin-top:18px}.decision-card{background:var(--dark);color:#fff;padding:32px;border-radius:4px 28px 4px 4px;box-shadow:18px 18px 0 var(--lime)}.decision-card p{color:#d6e5dd;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.decision-card ul{list-style:none;margin:22px 0 0;padding:0}.decision-card li{display:flex;align-items:center;gap:15px;padding:16px 0;border-top:1px solid #ffffff26;font-family:"DM Serif Display",serif;font-size:20px}.decision-card li span{color:var(--lime);font:900 10px Manrope,sans-serif}.faq-list{border-top:1px solid var(--line)}.faq-list details{border-bottom:1px solid var(--line);padding:20px 4px}.faq-list summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between}.faq-list summary:after{content:"+";color:var(--green);font-size:20px}.faq-list details[open] summary:after{content:"–"}.faq-list p{max-width:760px;color:var(--muted);line-height:1.7;font-size:13px}.cta-band{background:var(--lime);padding:50px max(28px,calc((100vw - 1128px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}.cta-band .eyebrow{color:var(--dark);margin-bottom:8px}.cta-band h2{font-size:40px;margin:0}.cta-band>a{background:var(--ink);color:#fff;padding:16px 23px;border-radius:999px;font-weight:900;font-size:13px}footer{background:#101a16;color:#fff;padding:70px max(28px,calc((100vw - 1128px)/2)) 30px}.footer-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:55px}.footer-grid>div{display:flex;flex-direction:column;gap:11px}.footer-grid p{color:#aebbb5;font-size:12px;line-height:1.6;max-width:280px}.footer-grid strong{color:var(--lime);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.footer-grid a{color:#cbd4cf;font-size:12px}.operator{font-weight:800}.legal-panels{margin-top:46px;border-top:1px solid #2f3a35}.legal-panels details{border-bottom:1px solid #2f3a35;padding:14px 0;color:#bbc6c0;font-size:11px;line-height:1.7}.legal-panels summary{cursor:pointer;color:#fff;font-weight:800}.legal-panels p{max-width:970px}.legal-panels a{text-decoration:underline}.copyright{display:flex;justify-content:space-between;color:#7d8b84;font-size:10px;padding-top:28px}.detail-hero{max-width:1184px;margin:0 auto;padding:95px 28px 110px;display:grid;grid-template-columns:1.1fr .9fr;gap:90px;align-items:center} ign-items:flex-start;flex-direction:column;padding:40px 18px}.cta-band h2{font-size:34px}footer{padding-left:18px;padding-right:18px}.copyright{flex-direction:column;gap:8px}.detail-hero,.detail-body{padding:60px 18px}.detail-body h2{font-size:40px}}

<body>
  <div id="app"></div>
  <script>
    const base = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
    const makes=["Chevrolet","Ford","Honda","Hyundai","Jeep","Kia","Nissan","Subaru","Toyota","Other"];
    const years=Array.from({length:36},(_,i)=>2026-i);
    const conditions=[
      ["wont-start","Won't start","Dead battery, electrical issue, or unknown problem"],
      ["engine","Engine problem","Blown, seized, knocking, overheating, or smoking"],
      ["transmission","Transmission problem","Slipping, stuck, or no longer shifting"],
      ["accident","Accident damage","Collision, totaled, or major body damage"],
      ["high-mileage","High mileage","Too old or expensive to keep repairing"],
      ["other","Something else","Flood, fire, failed inspection, or simply unwanted"]
    ];
    const details={
      "sell-car-with-blown-engine":["Engine trouble","Sell a car with a blown or failing engine","A seized, knocking, smoking, or overheated engine can turn an ordinary car into an expensive decision. An as-is selling option lets you compare the vehicle's current value against the full repair estimate.",["Vehicles that no longer start","Cars with diagnosed engine failure","Overheating or low-compression vehicles","Cars already sitting at a repair shop"],"Be specific about whether the engine turns over, starts briefly, smokes, leaks, or has missing parts."],
      "sell-car-with-bad-transmission":["Transmission trouble","Sell a car with a bad transmission","Transmission replacement can cost more than an older vehicle is worth. You may still have selling options even if the car slips, will not shift, or cannot move under its own power.",["Automatic or manual transmission failure","Vehicles stuck in one gear","Cars that move only briefly","Quoted transmission replacements"],"Tell the buyer whether the car starts, whether it moves, and what a shop diagnosed."],
      "sell-non-running-car":["Non-running vehicles","Sell a car that does not run","A vehicle does not need to drive to have value. Condition, completeness, title status, demand for its parts, and local pickup availability can all affect buyer interest.",["No-start vehicles","Cars with dead batteries or missing keys","Vehicles parked for an extended time","Unknown mechanical problems"],"Do not guess about the cause. An accurate description usually produces a more dependable offer."],
      "sell-totaled-car":["Accident damage","Explore options for a totaled or damaged car","Collision damage does not always eliminate a vehicle's value. Buyers may consider the remaining parts, drivetrain, title status, and local salvage demand.",["Insurance-totaled vehicles","Front, rear, or side collision damage","Airbag deployment","Salvage or rebuilt titles"],"Disclose all visible damage, airbag deployment, fluid leaks, and whether the vehicle can roll and steer."],
      "sell-high-mileage-car":["High mileage","Sell a high-mileage car as-is","When repair frequency starts climbing, selling before the next major bill can be worth comparing. Mileage alone does not determine whether a buyer may be interested.",["Vehicles above 150,000 miles","Older commuter cars","Cars that repeatedly fail inspection","Vehicles needing several repairs"],"Include the exact mileage and be clear about current warning lights and recent repairs."],
      "sell-car-without-title":["Title questions","Can you sell a car without the title?","Possibly, but requirements vary significantly by state, vehicle, and buyer. A clear title in the owner's name usually creates the most options.",["Lost or misplaced title","Lien recorded on the title","Salvage or rebuilt title","Inherited or transferred vehicle"],"Never claim ownership you cannot document. A buyer may require a replacement title or other state-specific paperwork."]
    };
    const app=document.getElementById('app');
    const link=(topic)=>`${base}/?page=${topic}`;
    function header(){return `<header class="site-header"><a class="brand" href="${base}/"><span class="brand-mark">A</span><span>As-Is Auto Offers</span></a><nav><a href="${base}/#how-it-works">How it works</a><a href="${base}/#vehicles">Vehicles we help with</a><a href="${base}/#questions">FAQs</a></nav><a class="header-cta" href="${base}/#offer">Check my vehicle</a></header>`}
    function footer(){return `<footer><div class="footer-grid"><div><div class="brand"><span class="brand-mark">A</span><span>As-Is Auto Offers</span></div><p>A clearer path for owners of damaged, non-running, and unwanted vehicles.</p><p class="operator">A Stone Canyon AI project.</p></div><div><strong>Vehicle conditions</strong><a href="${link('sell-car-with-blown-engine')}">Blown engine</a><a href="${link('sell-car-with-bad-transmission')}">Bad transmission</a><a href="${link('sell-non-running-car')}">Non-running car</a><a href="${link('sell-totaled-car')}">Totaled car</a></div><div><strong>Company</strong><a href="mailto:matt.weidner@stonecanyon.ai">Contact</a><a href="${base}/#privacy">Privacy</a><a href="${base}/#terms">Terms</a></div></div><div class="legal-panels"><details id="partner-disclosure"><summary>Partner and advertising disclosure</summary><p>As-Is Auto Offers is an independent marketing and matching service, not a vehicle dealer, dismantler, towing company, or lender. We may connect vehicle owners with third-party buyers and may earn compensation from a buyer following a referral or completed transaction. We do not guarantee an offer, sale price, pickup time, buyer availability, or acceptance of any vehicle.</p></details><details id="privacy"><summary>Privacy policy</summary><p><strong>Effective August 13, 2026.</strong> We collect information you submit, including contact details, vehicle information, location, ownership/title status, and request activity. We use it to process requests, communicate with you, improve the service, prevent fraud, and connect you with participating vehicle buyers when integrations are active. You may request access, correction, or deletion by emailing <a href="mailto:matt.weidner@stonecanyon.ai">matt.weidner@stonecanyon.ai</a>.</p></details><details id="terms"><summary>Terms of use</summary><p><strong>Effective August 13, 2026.</strong> You must be at least 18 and authorized to provide information about the vehicle. Submitting a request does not create an offer or purchase agreement. Any offer, inspection, payment, towing, title transfer, or transaction is solely between you and the third-party buyer.</p></details></div><div class="copyright"><span>© 2026 As-Is Auto Offers. All rights reserved.</span><span>Contact: matt.weidner@stonecanyon.ai</span></div></footer>`}
    function renderHome(){
      app.innerHTML=`<main>${header()}<section class="hero" id="top"><div class="hero-copy"><p class="eyebrow">Sell it as-is. Skip the repair bill.</p><h1>Find a buyer for your car—in any condition.</h1><p class="hero-lede">Tell us what happened to your vehicle. We help connect owners of damaged, non-running, totaled, and high-mileage cars with available vehicle buyers.</p><div class="trust-row"><span>✓ Free to check</span><span>✓ No obligation</span><span>✓ Pickup may be available</span></div><div class="hero-note"><strong>Repair estimate too high?</strong><span>Before putting more money into the car, see whether an as-is sale makes more sense.</span></div></div><div class="offer-card" id="offer"></div></section><section class="proof-strip"><div><strong>Any condition</strong><span>Running or not</span></div><div><strong>Clear process</strong><span>No listing or haggling</span></div><div><strong>Nationwide reach</strong><span>Buyer availability varies</span></div><div><strong>You decide</strong><span>No obligation to accept</span></div></section><section class="section" id="how-it-works"><div class="section-heading"><p class="eyebrow">Simple from the start</p><h2>Three steps. No classified listing.</h2><p>We gather the details vehicle buyers need so you can avoid repeating the same story over and over.</p></div><div class="three-up"><article><span>01</span><h3>Describe the vehicle</h3><p>Add the year, make, model, location, running condition, and title status.</p></article><article><span>02</span><h3>Review available options</h3><p>When integrations are active, your request may be matched with participating vehicle buyers.</p></article><article><span>03</span><h3>Choose what works</h3><p>If you accept a buyer’s offer, that buyer coordinates the transaction and any available pickup.</p></article></div></section><section class="section soft" id="vehicles"><div class="section-heading"><p class="eyebrow">Cars don’t need to be perfect</p><h2>We help with the hard-to-sell ones.</h2></div><div class="condition-cards">${conditions.slice(0,6).map((c,i)=>{const paths=['sell-non-running-car','sell-car-with-blown-engine','sell-car-with-bad-transmission','sell-totaled-car','sell-high-mileage-car','sell-car-without-title'];return `<a href="${link(paths[i])}"><span>${c[1]}</span><strong>${c[2]}</strong><em>Explore options →</em></a>`}).join('')}</div></section><section class="section compare"><div><p class="eyebrow">Repair or sell?</p><h2>Sometimes the best repair decision is not making one.</h2><p>A major engine or transmission estimate can exceed the practical value of an older vehicle. Checking an as-is sale option gives you another number to compare before authorizing repairs.</p><a class="text-link" href="#offer">Check my vehicle →</a></div><div class="decision-card"><p>Before paying the repair bill, compare:</p><ul><li><span>01</span>Current as-is value</li><li><span>02</span>Total repair cost</li><li><span>03</span>Post-repair reliability</li><li><span>04</span>Time and towing costs</li></ul></div></section><section class="section" id="questions"><div class="section-heading"><p class="eyebrow">Straight answers</p><h2>Questions before you start</h2></div><div class="faq-list"><details open><summary>Is checking my vehicle free?</summary><p>Yes. There is no charge to submit vehicle details and no obligation to accept a buyer’s offer.</p></details><details><summary>Does As-Is Auto Offers buy my car?</summary><p>No. We are an independent marketing and vehicle-buyer matching service. Participating third-party buyers determine eligibility, make offers, purchase vehicles, and arrange any available pickup.</p></details><details><summary>Can I sell a vehicle that does not run?</summary><p>Potentially. Participating buyers may purchase vehicles with mechanical problems, accident damage, missing keys, or other issues.</p></details><details><summary>How does As-Is Auto Offers make money?</summary><p>We may receive a marketing or referral fee from a participating vehicle buyer if a referred owner completes a transaction.</p></details></div></section><section class="cta-band"><div><p class="eyebrow">Your car. Your choice.</p><h2>See whether selling as-is makes sense.</h2></div><a href="#offer">Start my vehicle check</a></section>${footer()}</main>`;
      setupForm();
    }
    function setupForm(){
      let step=0;const data={zip:'',year:'',make:'',model:'',condition:'',runs:'',title:'',name:'',email:'',phone:''};const card=document.getElementById('offer');
      function field(){
        if(step===0)return `<fieldset><legend>Where is the vehicle located?</legend><p class="field-help">Your ZIP code helps determine which vehicle buyers may serve your area.</p><label>ZIP code</label><input data-f="zip" inputmode="numeric" maxlength="5" value="${data.zip}" placeholder="e.g. 12401"></fieldset>`;
        if(step===1)return `<fieldset><legend>Tell us about the vehicle.</legend><div class="field-grid"><div><label>Year</label><select data-f="year"><option value="">Select</option>${years.map(y=>`<option ${String(y)===data.year?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Make</label><select data-f="make"><option value="">Select</option>${makes.map(m=>`<option ${m===data.make?'selected':''}>${m}</option>`).join('')}</select></div></div><label>Model</label><input data-f="model" value="${data.model}" placeholder="e.g. Altima"></fieldset>`;
        if(step===2)return `<fieldset><legend>What best describes the car?</legend><div class="choice-grid">${conditions.map(c=>`<button type="button" class="choice ${data.condition===c[0]?'active':''}" data-choice="condition" data-value="${c[0]}"><strong>${c[1]}</strong><span>${c[2]}</span></button>`).join('')}</div><label class="section-label">Can it start and move under its own power?</label><div class="segmented">${['Yes','No','Not sure'].map(v=>`<button type="button" class="${data.runs===v?'active':''}" data-choice="runs" data-value="${v}">${v}</button>`).join('')}</div></fieldset>`;
        if(step===3)return `<fieldset><legend>What is the title status?</legend><p class="field-help">Requirements vary by buyer and state. Choose the closest answer.</p><div class="stacked-choices">${['Clean title in my name','Salvage or rebuilt title','Title has a lien','I cannot find the title','Not sure'].map(v=>`<button type="button" class="${data.title===v?'active':''}" data-choice="title" data-value="${v}">${v}<span>›</span></button>`).join('')}</div></fieldset>`;
        return `<fieldset><legend>Where should we send your available options?</legend><label>Full name</label><input data-f="name" autocomplete="name" value="${data.name}" placeholder="Your name"><div class="field-grid"><div><label>Email</label><input data-f="email" type="email" value="${data.email}" placeholder="you@example.com"></div><div><label>Phone</label><input data-f="phone" type="tel" value="${data.phone}" placeholder="(555) 555-5555"></div></div><p class="consent">By continuing, you agree to our <a href="#privacy">Privacy Policy</a> and <a href="#terms">Terms</a>, and consent to receive calls or texts about your request from As-Is Auto Offers and matched vehicle-buying partners, including by automated technology. Consent is not a condition of purchase. Message/data rates may apply.</p></fieldset>`;
      }
      function validate(){if(step===0&&!/^\d{5}$/.test(data.zip))return'Enter a valid 5-digit ZIP code.';if(step===1&&(!data.year||!data.make||!data.model.trim()))return'Add the year, make, and model.';if(step===2&&(!data.condition||!data.runs))return'Choose the vehicle condition and whether it moves.';if(step===3&&!data.title)return'Choose the closest title option.';if(step===4&&(!data.name.trim()||!data.email.includes('@')||data.phone.replace(/\D/g,'').length<10))return'Add your name, email, and a valid phone number.';return''}
      function draw(error=''){card.innerHTML=`<form><div class="form-topline"><span>Vehicle check</span><span>Step ${step+1} of 5</span></div><div class="progress"><span style="width:${(step+1)*20}%"></span></div><p class="step-label">${['Location','Vehicle','Condition','Ownership','Contact'][step]}</p>${field()}${error?`<p class="form-error" role="alert">${error}</p>`:''}<div class="form-actions">${step?'<button class="back" type="button">Back</button>':''}<button class="primary" type="submit">${step<4?'Continue':'Check available options'}</button></div><p class="secure-note">🔒 Your information is used only to process your request.</p></form>`;card.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>data[el.dataset.f]=el.value);card.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{data[el.dataset.choice]=el.dataset.value;draw()});const back=card.querySelector('.back');if(back)back.onclick=()=>{step--;draw()};card.querySelector('form').onsubmit=e=>{e.preventDefault();card.querySelectorAll('[data-f]').forEach(el=>data[el.dataset.f]=el.value);const err=validate();if(err)return draw(err);if(step<4){step++;draw()}else card.innerHTML=`<div class="complete-state" role="status"><span class="complete-icon">✓</span><p class="eyebrow">Vehicle details complete</p><h2>Thanks, ${data.name.split(' ')[0]}.</h2><p>Buyer connections are being activated. Your information has not been sent to a vehicle buyer yet. We’ll use the contact details provided to follow up about available options.</p><div class="vehicle-summary"><strong>${data.year} ${data.make} ${data.model}</strong><span>${data.zip} · ${data.runs==='Yes'?'Starts and moves':data.runs==='No'?'Does not run':'Running status unknown'}</span></div><button class="secondary" id="restart">Check another vehicle</button></div>`;const restart=document.getElementById('restart');if(restart)restart.onclick=()=>setupForm()}}
      draw();
    }
    function renderDetail(p){const d=details[p];if(!d)return renderHome();app.innerHTML=`<main>${header()}<section class="detail-hero"><div><p class="eyebrow">${d[0]}</p><h1>${d[1]}</h1><p>${d[2]}</p><a class="detail-cta" href="${base}/#offer">Check my vehicle</a></div><aside><p>Vehicles that may qualify</p>${d[3].map(x=>`<span>✓ ${x}</span>`).join('')}</aside></section><section class="detail-body"><div><p class="eyebrow">What buyers need</p><h2>Clear details lead to more dependable options.</h2><p>${d[4]}</p><p>As-Is Auto Offers is an independent matching service. Third-party buyers determine eligibility, offers, inspections, payment, and pickup. Checking is free and there is no obligation to accept an offer.</p></div><div class="detail-checklist"><strong>Have these details ready</strong><span>Year, make, model, and trim</span><span>Exact mileage</span><span>ZIP code and pickup location</span><span>Title and lien status</span><span>Whether it starts, moves, rolls, and steers</span><span>Known damage and missing components</span></div></section><section class="cta-band"><div><p class="eyebrow">Your car. Your choice.</p><h2>See whether selling as-is makes sense.</h2></div><a href="${base}/#offer">Start my vehicle check</a></section>${footer()}</main>`}
    const page=new URLSearchParams(location.search).get('page');page?renderDetail(page):renderHome();
  </script>
</body>
</html>
