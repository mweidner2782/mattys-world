name: Deploy Gatherly and BidPathway to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "gatherly/**"
      - "bidpathway/**"
      - ".github/workflows/deploy-gatherly-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -R gatherly/. _site/
          mkdir -p _site/bidpathway
          cp -R bidpathway/. _site/bidpathway/
          python - <<'PY'
          from pathlib import Path

          # Keep Gatherly at the GitHub Pages root, but route the BidPathway custom domain
          # directly into the BidPathway landing page.
          root = Path('_site/index.html')
          s = root.read_text()
          redirect = "<script>if(['bidpathway.com','www.bidpathway.com'].includes(location.hostname)){location.replace('/bidpathway/');}</script>"
          if redirect not in s:
              s = s.replace('<head>', '<head>' + redirect, 1)
          root.write_text(s)

          # Install the Google Ads account tag on the BidPathway landing page.
          p = Path('_site/bidpathway/index.html')
          s = p.read_text()
          google_tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18386204983"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'AW-18386204983');
          </script>
          '''
          if 'AW-18386204983' not in s:
              s = s.replace('<head>', '<head>\n' + google_tag, 1)
          p.write_text(s)
          PY

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
