name: Deploy Gatherly and BidPathway to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "gatherly/**"
      - "bidpathway/**"
      - ".github/workflows/deploy-gatherly-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -R gatherly/. _site/
          mkdir -p _site/bidpathway
          cp -R bidpathway/. _site/bidpathway/

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
